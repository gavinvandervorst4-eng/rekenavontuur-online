const app=document.getElementById('app');let unlocked=false;let session=null,best=0;try{best=Number(localStorage.getItem('rekenBest'))||0;session=JSON.parse(localStorage.getItem('rekenSession200'));if(session&&(!Array.isArray(session.ids)||!session.ids.every(id=>data[id-1])||!Number.isInteger(session.pos)))session=null}catch{};

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(ch,ids){let n=Number(document.getElementById('length')?.value||100);let pool=ids||data.filter(x=>!ch||x.chapter===ch).map(x=>x.id);session={ids:shuffle([...pool]).slice(0,ids?pool.length:n),pos:0,results:[],checked:false};save();render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return s.toLowerCase().trim().replace(/−/g,'-').replace(/½/g,'.5').replace(/²/g,'2').replace(/\s+/g,'').replace(/(cm2|cm|°c|€|euro|kilometer|km)$/,'').replace(/×|bij/g,'x')}
function numeric(s){s=s.replace(',','.');if(/^-?\d+\s+\d+\/\d+$/.test(s)){let [w,f]=s.split(/\s+/);return Number(w)+(Number(w)<0?-1:1)*numeric(f)}if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){let [a,b]=s.split('/').map(Number);return b?a/b:NaN}return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN}
